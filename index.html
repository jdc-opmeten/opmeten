<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opmeten sleuven</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1d2330; font-size: 16px; }
  header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #d9dde5; padding: 8px 10px; }
  header .rij { display: flex; gap: 8px; align-items: center; }
  header input { flex: 1; padding: 8px; border: 1px solid #c8ced9; border-radius: 8px; font-size: 1rem; min-width: 0; }
  .tabs { display: flex; gap: 6px; margin-top: 8px; }
  .tabs button { flex: 1; padding: 9px; border: 1px solid #c8ced9; background: #fff; border-radius: 8px; font-size: .95rem; }
  .tabs button.aan { background: #1f7a3f; border-color: #1f7a3f; color: #fff; }
  #map { height: 34vh; min-height: 220px; }
  #gps { font-size: .8rem; color: #6b7384; padding: 4px 10px; }
  .blok { background: #fff; border: 1px solid #d9dde5; border-radius: 12px; margin: 10px; padding: 12px; }
  .blok h3 { margin: 0 0 8px; font-size: 1rem; }
  .knoppen { display: flex; flex-direction: column; gap: 8px; margin: 10px; }
  .groot { width: 100%; padding: 16px; font-size: 1.05rem; border: 0; border-radius: 12px; background: #1f7a3f; color: #fff; }
  .groot.grijs { background: #5b6478; }
  .groot.rood { background: #b42318; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 9px 12px; border: 1px solid #c8ced9; border-radius: 20px; background: #fff; font-size: .95rem; }
  .chip.aan { background: #1f7a3f; border-color: #1f7a3f; color: #fff; }
  .klein { font-size: .85rem; color: #6b7384; }
  .vorige { float: right; padding: 5px 10px; font-size: .8rem; border: 1px solid #c8ced9; border-radius: 14px; background: #f5f6f8; }
  label.veld { display: block; margin: 6px 0 4px; font-weight: 600; font-size: .9rem; }
  input.tekst, textarea { width: 100%; padding: 10px; border: 1px solid #c8ced9; border-radius: 8px; font-size: 1rem; }
  .meters { font-size: 1.4rem; padding: 12px; text-align: center; }
  .stap { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid #eef0f4; }
  .stap .naam { flex: 1; }
  .stap button { width: 38px; height: 38px; border: 1px solid #c8ced9; border-radius: 50%; background: #fff; font-size: 1.2rem; }
  .stap .n { min-width: 24px; text-align: center; font-weight: 600; }
  .plus { display: flex; gap: 6px; margin-top: 6px; }
  .plus input { flex: 1; padding: 8px; border: 1px solid #c8ced9; border-radius: 8px; font-size: .95rem; min-width: 0; }
  .plus button { padding: 8px 12px; border: 1px solid #c8ced9; border-radius: 8px; background: #fff; }
  .kaart-sleuf { border-top: 1px solid #eef0f4; padding: 8px 0; }
  .kaart-sleuf:first-child { border-top: 0; }
  .tabelwrap { overflow-x: auto; }
  table { border-collapse: collapse; font-size: .8rem; }
  th, td { border: 1px solid #d9dde5; padding: 4px 7px; white-space: nowrap; text-align: center; }
  td.l, th.l { text-align: left; }
  tr.kop td { background: #eef0f4; font-weight: 600; text-align: left; }
  .status { display: flex; gap: 12px; align-items: center; background: #fff; border: 3px solid #1f7a3f; border-radius: 14px; padding: 10px 12px; }
  .status .badge { flex: none; width: 46px; height: 46px; border-radius: 50%; color: #fff; font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .status b { display: block; font-size: 1.15rem; }
  .status span.t { display: block; font-size: .85rem; color: #4a5266; margin-top: 2px; }
  .kies { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .kies .lbl { font-size: .8rem; color: #6b7384; }
  .kies button { padding: 7px 12px; border-radius: 18px; border: 2px solid; background: #fff; font-weight: 600; font-size: .9rem; }
  .kies button.aan { color: #fff; }
  .groot small { display: block; font-size: .8rem; font-weight: 400; opacity: .9; margin-top: 3px; }
  .wis { width: 100%; padding: 10px; font-size: .9rem; border: 1px solid #b42318; color: #b42318; background: #fff; border-radius: 12px; }
  .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: 2px; }
  .tag.bezig { background: #dcf3e4; color: #1f7a3f; }
  .tag.klaar { background: #eef0f4; color: #5b6478; }
  .verborgen { display: none; }
  .gr { overflow-x: auto; margin: 0 -2px; }
  .gr table { border-collapse: collapse; font-size: .9rem; min-width: 100%; }
  .gr th, .gr td { border: 1px solid #e3e6ec; padding: 3px 2px; text-align: center; white-space: nowrap; }
  .gr td.l, .gr th.l { text-align: left; position: sticky; left: 0; background: #fff; z-index: 2; padding: 4px 6px; max-width: 150px; white-space: normal; border-right: 2px solid #c8ced9; }
  .gr tr.sh td { background: #eef0f4; font-weight: 700; text-align: left; padding: 4px 6px; position: static; }
  .gr td.sel, .gr th.sel { background: #f4faf6; border-left: 3px solid var(--c); border-right: 3px solid var(--c); }
  .gr th.sel { border-top: 3px solid var(--c); }
  .gr td.sel.onder { border-bottom: 3px solid var(--c); }
  .gr .zz { font-size: .8rem; min-width: 56px; color: #1d2330; border: 1px solid #c8ced9; border-radius: 12px; padding: 4px 6px; }
  .gr .kop { min-width: 38px; height: 34px; border-radius: 17px; border: 2px solid; background: #fff; font-weight: 700; font-size: 1rem; }
  .gr .sb { display: inline-block; min-width: 38px; padding: 5px 0; font-size: 1.25rem; color: #8a93a6; cursor: pointer; }
  .gr .sb.on { color: #1f7a3f; }
  .gr input.gi { width: 56px; padding: 7px 3px; font-size: 1rem; text-align: center; border: 1px solid #c8ced9; border-radius: 6px; }
  .gr input.gt { width: 110px; text-align: left; padding: 7px 5px; }
  #nwPartij { padding: 8px; border: 1px solid #c8ced9; border-radius: 8px; background: #fff; max-width: 40%; }
  .nav { display: flex; gap: 8px; align-items: stretch; margin: 0; }
  .nav button.pijl { flex: none; width: 52px; border: 1px solid #c8ced9; background: #fff; border-radius: 12px; font-size: 1.6rem; color: #1d2330; }
  .nav button.pijl:disabled { opacity: .3; }
  .nav .mid { flex: 1; border: 3px solid #1f7a3f; border-radius: 14px; background: #fff; padding: 8px 10px; display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; color: inherit; }
  .nav .mid .badge { flex: none; width: 38px; height: 38px; border-radius: 50%; color: #fff; font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .nav .mid b { display: block; font-size: 1.05rem; }
  .nav .mid span.t { display: block; font-size: .78rem; color: #4a5266; }
  .twee { display: flex; gap: 8px; }
  .twee > button { flex: 1; }
  .twee .groot { padding: 13px 8px; font-size: .98rem; }
  .zij { display: flex; gap: 6px; align-items: center; }
  .zij .lbl { font-size: .85rem; color: #6b7384; margin-right: 2px; }
  .zij .chip { flex: 1; padding: 8px 4px; text-align: center; }
  .chip.aan2 { background: #dcf3e4; border-color: #1f7a3f; color: #1f7a3f; font-weight: 700; }
  .mrij { display: flex; gap: 8px; align-items: center; }
  .mrij label { font-weight: 600; font-size: .9rem; white-space: nowrap; }
  .mrij input { flex: 1; font-size: 1.3rem; padding: 8px; text-align: center; border: 1px solid #c8ced9; border-radius: 8px; min-width: 0; }
  .wislink { background: none; border: 0; color: #b42318; font-size: .85rem; padding: 6px; }
  #kompas { position: absolute; z-index: 1300; right: 10px; top: 10px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #c8ced9; background: #fff; font-size: 1.1rem; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  #mapwrap { position: relative; }
  #kslotlaag { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 1200; touch-action: pan-y; background: transparent; }
  #kslot { position: absolute; z-index: 1300; left: 10px; top: 10px; height: 42px; padding: 0 14px; border-radius: 21px; border: 1px solid #c8ced9; background: #fff; font-size: .9rem; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  #kslot.open { background: #1f7a43; color: #fff; border-color: #1f7a43; }
  .letter { background: #1d2330; color: #fff; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; font-weight: 700; font-size: .75rem; border: 2px solid #fff; }
  .sleuflabel { background: #fff; border: 1px solid #1d2330; border-radius: 6px; padding: 1px 5px; font-weight: 600; font-size: .75rem; }
.mp { background: #fff; border: 2px solid #b42318; color: #b42318; border-radius: 50%; width: 18px; height: 18px; line-height: 14px; text-align: center; font-weight: 700; font-size: .65rem; }
  .mp.ok { border-color: #1f7a3f; color: #1f7a3f; }
  .mpregel { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #eef0f4; font-size: .9rem; }
  .mpregel span.t { flex: 1; }
  .mpregel button { border: 1px solid #b42318; color: #b42318; background: #fff; border-radius: 8px; padding: 4px 9px; }
  .appver { position: fixed; right: 8px; bottom: 3px; font-size: 10px; color: #8a8a8a; opacity: .6; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<header>
  <div class="rij">
    <input id="werf" type="text" placeholder="Werf (naam of nummer)">
  </div>
  <div class="tabs">
    <button id="tabOpmeten" class="aan" type="button">Opmeten</button>
    <button id="tabOverzicht" type="button">Overzicht</button>
  </div>
</header>

<section id="vOpmeten">
  <div id="mapwrap"><div id="map"></div><div id="kslotlaag"></div><button id="kslot" type="button">&#128274; Kaart vast</button><button id="kompas" type="button" title="Kaart draait mee met je looprichting">&#129517;</button></div>
  <div id="gps">GPS: nog geen positie</div>
  <div class="knoppen" id="acties"></div>
  <div id="formulier"></div>
</section>

<section id="vOverzicht" class="verborgen">
  <div class="blok"><h3>Sleuven</h3><div id="lijst"></div></div>
  <div class="blok">
    <h3>Opnameblad-weergave</h3>
    <p class="klein">Zo komen de gegevens op het opnameblad terecht: elke sleuf is een kolom (A-01, A-02, ...). In de cel staan de meters.</p>
    <div class="tabelwrap" id="tabel"></div>
  </div>
  <div class="knoppen">
    <button id="kopieer" class="groot grijs" type="button">Kopieer als tekst</button>
    <button id="csv" class="groot grijs" type="button">Download als CSV</button>
    <button id="wis" class="groot rood" type="button">Alles wissen</button>
  </div>
  <div id="melding" class="klein" style="margin:0 12px 24px"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="leaflet-rotate.js"></script>
<script>
(function () {
  'use strict';

  // ---------- Vaste lijsten (uit het opnameblad) ----------
  var BOVENBOUW = ['Berm', 'Losse bestrating', 'Bitumen / cementbeton'];
  var KLEUR = { 'Berm': '#2e8b57', 'Losse bestrating': '#e08a00', 'Bitumen / cementbeton': '#35507a', '': '#888' };
  var BIJZ = ['Meerdiepte', 'Stutten', 'Boordsteen uitbreken en plaatsen', 'Kabels opbinden of verplaatsen', 'Bronbemaling', 'Boring', 'Doorsteek', 'Vachtbuizen'];
  var PARTIJEN = [
    { naam: 'Fluvius', types: ['MS-PRC', 'LS 4G150', 'LS 4G240', 'OV 4G10'] },
    { naam: 'Gas', types: ['Gas'] },
    { naam: 'Drinkwater', types: ['100 - 200p', 'HDPE', 'SRV'] },
    { naam: 'Telecom en overige', types: ['Coax 20 mm', 'Coax 14 mm', 'Wachtbuis', 'DB 7'] }
  ];
  var ZIJDEN = ['Links', 'Midden', 'Rechts'];
  // Gegevens van het dossier, meegegeven door het portaal werfcoordinatie (?dnw=..&werf=..&k=LS,OV&p=Wlink,Pidpa)
  var Q = {}; try { new URLSearchParams(location.search).forEach(function (v, k) { Q[k] = v; }); } catch (e) {}
  var CTX = { dnw: (Q.dnw || '').replace(/\D/g, ''), werf: Q.werf || '', k: (Q.k || '').split(',').filter(Boolean), p: (Q.p || '').split(',').filter(Boolean) };
  var SLEUTEL = 'opmeten.v1' + (CTX.dnw ? '.' + CTX.dnw : '');   // elke werf uit het portaal heeft zijn eigen opmeting
  var TOONALLES = false;
  function relevant(naam, t) {
    if (!CTX.k.length && !CTX.p.length) return true;
    if (naam === 'Fluvius') return !t || CTX.k.some(function (k) { return t.indexOf(k) === 0; }) || (S.eigen.Fluvius || []).indexOf(t) >= 0;
    if (naam === 'Gas') return CTX.k.indexOf('Gas') >= 0;
    if (naam === 'Drinkwater') return CTX.p.indexOf('Pidpa') >= 0;
    return CTX.p.some(function (x) { return x !== 'Pidpa'; });
  }

  // ---------- Toestand ----------
  var S = { werf: '', sleuven: [], eigen: {}, sel: -1, mp: { t: 'punt', z: 'Rechts' } };
  try { var opgeslagen = JSON.parse(localStorage.getItem(SLEUTEL)); if (opgeslagen && opgeslagen.sleuven) S = opgeslagen; } catch (e) {}
  if (!S.mp) S.mp = { t: 'punt', z: 'Rechts' };
  // migratie van het oude model (aaneengeschakelde punten) naar een eigen lijn per sleuf
  S.sleuven.forEach(function (x, i) {
    if (S.punten && x.start === undefined) { x.start = S.punten[i] || null; x.einde = S.punten[i + 1] || null; }
    x.start = x.start || null; x.einde = x.einde || null; x.zijdeEinde = x.zijdeEinde || '';
    x.tussen = (x.tussen || []).map(function (m) { return { p: m.p, z: m.z, t: 'punt', n: m.n || '' }; });
    delete x.pad;
  });
  delete S.punten;
  function afstand(a, b) { var R = 6371000, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dn = (b[1] - a[1]) * r; var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dn / 2) * Math.sin(dn / 2); return 2 * R * Math.asin(Math.sqrt(x)); }
  function andere(z) { return z === 'Links' ? 'Rechts' : 'Links'; }
  function punten(s) {   // geordend: start, meetpunten, einde (zo wordt de lijn getekend)
    var r = [];
    if (s.start) r.push({ p: s.start, z: s.zijde, t: 'start' });
    (s.tussen || []).forEach(function (m) { r.push({ p: m.p, z: m.z, t: 'punt' }); });
    if (s.einde) r.push({ p: s.einde, z: s.zijdeEinde || s.zijde, t: 'einde' });
    return r;
  }
  function doorsteken(s) {   // twee opeenvolgende punten aan een andere kant (links/rechts) = doorsteek
    var P = punten(s), r = [];
    for (var i = 1; i < P.length; i++) { var a = P[i - 1], b = P[i]; if ((a.z === 'Links' && b.z === 'Rechts') || (a.z === 'Rechts' && b.z === 'Links')) r.push({ van: a, tot: b, m: Math.round(afstand(a.p, b.p)), i: i - 1 }); }
    return r;
  }
  function syncDoorsteek(s) { if (doorsteken(s).length && s.bijz.indexOf('Doorsteek') < 0) s.bijz.push('Doorsteek'); }
  function laatstePunt() { var n = S.sleuven.length; if (!n) return null; var s = S.sleuven[n - 1], t = s.tussen; return t.length ? t[t.length - 1].p : s.start; }
    function bewaar() { try { localStorage.setItem(SLEUTEL, JSON.stringify(S)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function letter(i) { var s = ''; i++; while (i > 0) { var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }
  function kol(i) { return 'A-' + (i + 1 < 10 ? '0' : '') + (i + 1); }
  function kopie(o) { return JSON.parse(JSON.stringify(o)); }
  var KL = ['#1f7a3f', '#1a73e8', '#c2410c', '#7e22ce', '#0e7490', '#b45309'];
  function kl(i) { return KL[i % KL.length]; }
  function actief() { var n = S.sleuven.length; return n > 0 && !S.sleuven[n - 1].einde; }   // laatste sleuf loopt nog (heeft nog geen einde)
  function typesVan(p) { var basis = PARTIJEN.filter(function (x) { return x.naam === p; })[0].types; return basis.concat(S.eigen[p] || []); }
  function nieuweSleuf(vorige, pt) {
    return {
      start: pt, einde: null, meters: '', zijde: S.mp.z, zijdeEinde: '', tussen: [],
      bovenbouw: vorige ? vorige.bovenbouw : '',
      leidingen: vorige ? kopie(vorige.leidingen) : {},
      bijz: vorige ? vorige.bijz.filter(function (b) { return b !== 'Doorsteek'; }) : [], opm: ''
    };
  }

  // ---------- Kaart ----------
  var kaart = L.map('map', { zoomControl: false, rotate: true, bearing: 0, touchRotate: false, rotateControl: false }).setView([51.158, 4.445], 16);
  L.control.zoom({ position: 'bottomleft' }).addTo(kaart);
  // Kaart is standaard vast: scrollen op de kaart scrolt de pagina; de kaart past zichzelf aan. Knop linksboven maakt hem tijdelijk beweegbaar.
  var kaartSlot = true, slotTimer = null;
  function zetSlot(vast) {
    kaartSlot = vast; clearTimeout(slotTimer);
    $('kslotlaag').style.display = vast ? 'block' : 'none';
    $('kslot').className = vast ? '' : 'open';
    $('kslot').innerHTML = vast ? '&#128274; Kaart vast' : '&#128275; Kaart los';
    document.querySelector('.leaflet-control-zoom').style.display = vast ? 'none' : '';
    if (vast) { tekenKaart(true); }
    else slotTimer = setTimeout(function () { zetSlot(true); }, 15000);
  }
  $('kslot').onclick = function () { zetSlot(!kaartSlot); };
  $('map').addEventListener('pointerdown', function () { if (!kaartSlot) { clearTimeout(slotTimer); slotTimer = setTimeout(function () { zetSlot(true); }, 15000); } });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    referrerPolicy: 'strict-origin-when-cross-origin'
  }).addTo(kaart);
  var laag = L.layerGroup().addTo(kaart);
  var mijn = null, nauwk = null, laatstePos = null, liveLijn = null;

  function tekenKaart(passen) {
    laag.clearLayers();
    var alle = [];
    S.sleuven.forEach(function (s, i) {
      var P = punten(s), c = kl(i);
      if (!P.length) return;
      var ll2 = P.map(function (q) { return q.p; });
      var lijn = L.polyline(ll2, { color: s.einde ? (KLEUR[s.bovenbouw] || KLEUR['']) : c, weight: i === S.sel ? 8 : 5, opacity: .9 });
      lijn.on('click', function () { S.sel = i; bewaar(); renderAlles(); });
      if (ll2.length > 1) lijn.bindTooltip('Sleuf ' + (i + 1) + (s.meters ? ' (' + s.meters + ' m)' : ''), { permanent: true, direction: 'center', className: 'sleuflabel' });
      lijn.addTo(laag);
      doorsteken(s).forEach(function (d) { L.polyline([d.van.p, d.tot.p], { color: '#b42318', weight: 10, opacity: .45, dashArray: '2 8' }).addTo(laag); });
      function mk(pos, html, sz, sleep) {
        var m = L.marker(pos, { draggable: true, icon: L.divIcon({ className: '', html: html, iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2] }) });
        m.on('dragend', function () { var q = m.getLatLng(); sleep([q.lat, q.lng]); bewaar(); tekenKaart(false); });
        m.addTo(laag); return m;
      }
      if (s.start) mk(s.start, '<div class="letter" style="background:' + c + '">' + (i + 1) + '</div>', 22, function (q) { s.start = q; });
      (s.tussen || []).forEach(function (m) { var x = mk(m.p, '<div class="mp ok">&bull;</div>', 18, function (q) { m.p = q; }); x.bindTooltip(m.z, { direction: 'top' }); });
      if (s.einde) mk(s.einde, '<div class="letter" style="background:' + c + ';border-radius:4px">' + (i + 1) + '</div>', 22, function (q) { s.einde = q; });
      P.forEach(function (q) { alle.push(q.p); });
    });
    liveLijn = null;
    if (actief() && laatstePos) {
      liveLijn = L.polyline([laatstePunt(), [laatstePos.lat, laatstePos.lng]], { color: kl(S.sleuven.length - 1), weight: 5, dashArray: '8 8', opacity: .9 }).addTo(laag);
    }
    if (kaartSlot && actief() && laatstePos) alle.push([laatstePos.lat, laatstePos.lng]);
    if ((passen || kaartSlot) && alle.length) kaart.fitBounds(L.latLngBounds(alle), { maxZoom: 19, padding: [30, 30] });
  }

  // ---------- GPS ----------
  // Gladde positie: gemiddelde van de laatste fixes (korte tijd), gewogen naar nauwkeurigheid; dempt het GPS-gewiebel als je stilstaat

    if (mz) { var zv = mz.dataset.mpz; if (zv === 'auto') { S.zAuto = true; kand.n = 0; } else { S.zAuto = false; S.mp.z = zv; } S.alert = null; bewaar(); renderActies(); return; }
    var nv = e.target.closest('button[data-nav]');
    if (nv) { var t2 = Math.max(0, Math.min(S.sleuven.length - 1, (S.sel < 0 ? S.sleuven.length - 1 : S.sel) + (+nv.dataset.nav))); S.sel = t2; bewaar(); renderAlles(); return; }
  });

  // ---------- Formulier voor de gekozen sleuf ----------
  function rijOptie(lab, kl2, cellen) { return '<tr><td class="l">' + lab + '</td>' + cellen + '</tr>'; }
  function renderFormulier() {
    var f = $('formulier'), oud = f.querySelector('.gr'), sl = oud ? oud.scrollLeft : 0;
    if (!S.sleuven.length) { f.innerHTML = '<div class="blok klein">Tik op "Start sleuf 1" om te beginnen. De GPS-positie wordt het eerste punt (A).</div>'; return; }
    var N = S.sleuven.length, sel = (S.sel >= 0 && S.sel < N) ? S.sel : N - 1;
    var sh = function (t) { return '<tr class="sh"><td colspan="' + (N + 1) + '">' + t + '</td></tr>'; };
    var ord = [sel]; S.sleuven.forEach(function (x, k) { if (k !== sel) ord.push(k); });
    var laatste = '';
    var cel = function (fn) { return ord.map(function (k) { var x = S.sleuven[k]; return '<td' + (k === sel ? ' class="sel' + (laatste ? ' onder' : '') + '"' : '') + '>' + fn(x, k) + '</td>'; }).join(''); };
    var ctxAan = CTX.k.length || CTX.p.length;
    var h = '<div class="blok" style="padding:8px"><h3 style="margin:2px 4px 6px">Gegevens per sleuf</h3><p class="klein" style="margin:0 4px 6px">Net als in de meetstaat: elke kolom is een sleuf. De sleuf waar je mee bezig bent staat eerst, omkaderd. Tik op een ander cijfer om die sleuf te kiezen en aan te passen. Het pijltje onder de sleufnaam kopieert de gegevens van de vorige sleuf.</p><div class="gr"><table style="--c:' + kl(sel) + '"><tr><th class="l">Sleuf</th>' +
      ord.map(function (k) { var x = S.sleuven[k], c = kl(k); return '<th class="' + (k === sel ? 'sel' : '') + '"><button type="button" class="kop" data-gsel="' + k + '" style="border-color:' + c + ';' + (k === sel ? 'background:' + c + ';color:#fff' : 'color:' + c) + '">' + (k + 1) + '</button></th>'; }).join('') + '</tr>' +
      '<tr><td class="l klein">Zoals vorige</td>' + cel(function (x, k) { return k ? '<span class="sb" data-gv="' + k + '">&#8635;</span>' : ''; }) + '</tr>' +
      '<tr><td class="l"><b>Meters</b></td>' + cel(function (x, k) { return '<input class="gi" type="number" inputmode="decimal" step="0.1" min="0" data-gm="' + k + '" value="' + esc(x.meters) + '">'; }) + '</tr>' +
      sh('Zijde van de weg (tik om te wisselen)') +
      '<tr><td class="l">Begin</td>' + cel(function (x, k) { return '<span class="sb zz" data-zb="' + k + '">' + esc(x.zijde || '?') + '</span>'; }) + '</tr>' +
      '<tr><td class="l">Einde</td>' + cel(function (x, k) { return (x.einde ? '<span class="sb zz" data-ze="' + k + '">' + (x.zijdeEinde && x.zijdeEinde !== x.zijde ? esc(x.zijdeEinde) : '= begin') + '</span>' : '<span class="klein">loopt</span>'); }) + '</tr>' +
      sh('Wegbedekking') + BOVENBOUW.map(function (b) { return rijOptie(esc(b), '', cel(function (x, k) { var on = x.bovenbouw === b; return '<span class="sb' + (on ? ' on' : '') + '" data-gb="' + k + '" data-v="' + esc(b) + '">' + (on ? '&#9679;' : '&#9675;') + '</span>'; })); }).join('') +
      sh('Leidingen en kabels (aantal)');
    PARTIJEN.forEach(function (p) {
      if (!TOONALLES && !relevant(p.naam)) return;
      typesVan(p.naam).forEach(function (t) {
        if (!TOONALLES && !relevant(p.naam, t)) return;
        var key = p.naam + '|' + t;
        h += rijOptie(esc(p.naam === 'Fluvius' || p.naam === 'Gas' ? t : p.naam + ': ' + t), '', cel(function (x, k) { return '<input class="gi" type="number" inputmode="numeric" min="0" data-gl="' + k + '" data-key="' + esc(key) + '" value="' + (x.leidingen[key] || '') + '">'; }));
      });
    });
    laatste = '';
    h += sh('Bijzonderheden') + BIJZ.map(function (b) { return rijOptie(esc(b), '', cel(function (x, k) { var on = x.bijz.indexOf(b) >= 0; return '<span class="sb' + (on ? ' on' : '') + '" data-gz="' + k + '" data-v="' + esc(b) + '">' + (on ? '&#9679;' : '&#9675;') + '</span>'; })); }).join('') +
      '<tr><td class="l">Opmerking</td>' + (function () { laatste = 1; var r = cel(function (x, k) { return '<input class="gi gt" type="text" data-go="' + k + '" value="' + esc(x.opm) + '">'; }); laatste = ''; return r; })() + '</tr></table></div>';
    h += '<div class="plus" style="margin:8px 4px 0"><select id="nwPartij">' + PARTIJEN.map(function (p) { return '<option>' + esc(p.naam) + '</option>'; }).join('') + '</select><input type="text" id="nwType" placeholder="Ander type leiding"><button type="button" data-voegtoe="1">+</button></div>';
    if (ctxAan) h += '<p style="margin:8px 4px 0"><button type="button" class="chip" data-toonalles="1">' + (TOONALLES ? 'Enkel de leidingen van dit dossier tonen' : 'Alle leidingen tonen') + '</button> <span class="klein">Dossier ' + esc(CTX.dnw) + ' &middot; kabels: ' + esc(CTX.k.join(', ') || '-') + ' &middot; partijen: ' + esc(CTX.p.join(', ') || '-') + '</span></p>';
    h += '</div>';
    // lijn van de gekozen sleuf: start, meetpunten (met zijde), einde
    var s = S.sleuven[sel], ds = doorsteken(s), P = punten(s);
    h += '<div class="blok" style="border:3px solid ' + kl(sel) + '"><h3>Sleuf ' + (sel + 1) + ': lijn</h3>' + P.map(function (q, j) {
      var lab = q.t === 'start' ? 'Start' : q.t === 'einde' ? 'Einde' : 'Meetpunt ' + j;
      return '<div class="mpregel"><span class="t"><b>' + lab + '</b> - ' + esc(q.z) + '</span>' + (q.t === 'punt' ? '<button type="button" data-delmp="' + (j - 1) + '">&#10005;</button>' : '') + '</div>';
    }).join('');
    if (ds.length) h += '<div class="klein">' + ds.map(function (d, k) { return 'Doorsteek ' + (k + 1) + ': ' + d.van.z + ' &rarr; ' + d.tot.z + ', ca. ' + d.m + ' m (GPS)'; }).join('<br>') + '</div>';
    h += '</div>';
    f.innerHTML = h;
    var g = f.querySelector('.gr'); if (g) g.scrollLeft = sl;
  }

  $('formulier').addEventListener('click', function (e) {
    var zc = e.target.closest('[data-zb],[data-ze]');
    if (zc) {
      var kz = +(zc.dataset.zb !== undefined ? zc.dataset.zb : zc.dataset.ze), sz = S.sleuven[kz];
      if (sz) {
        if (zc.dataset.zb !== undefined) { sz.zijde = ZIJDEN[(ZIJDEN.indexOf(sz.zijde) + 1) % 3]; if (sz.zijdeEinde === sz.zijde) sz.zijdeEinde = ''; }
        else { var cyc = ['', 'Links', 'Midden', 'Rechts'], cur = sz.zijdeEinde && sz.zijdeEinde !== sz.zijde ? sz.zijdeEinde : '', nx = cyc[(cyc.indexOf(cur) + 1) % 4]; if (nx === sz.zijde) nx = cyc[(cyc.indexOf(nx) + 1) % 4]; sz.zijdeEinde = nx; }
        syncDoorsteek(sz); bewaar(); renderFormulier(); tekenKaart(false); renderActies();
      }
      return;
    }
    var td = e.target.closest('[data-gsel],[data-gv],[data-gb],[data-gz]');
    if (td) {
      var dd = td.dataset;
      if (dd.gsel !== undefined) { S.sel = +dd.gsel; bewaar(); renderAlles(); return; }
      var k = +(dd.gv !== undefined ? dd.gv : dd.gb !== undefined ? dd.gb : dd.gz), sx = S.sleuven[k]; if (!sx) return;
      if (dd.gv !== undefined && k > 0) { var vg = S.sleuven[k - 1]; sx.bovenbouw = vg.bovenbouw; sx.leidingen = kopie(vg.leidingen); sx.bijz = vg.bijz.slice(); }
      else if (dd.gb !== undefined) sx.bovenbouw = (sx.bovenbouw === dd.v ? '' : dd.v);
      else if (dd.gz !== undefined) { var ix = sx.bijz.indexOf(dd.v); if (ix >= 0) sx.bijz.splice(ix, 1); else sx.bijz.push(dd.v); }
      bewaar(); renderFormulier(); tekenKaart(false); return;
    }
    var el = e.target.closest('button'); if (!el) return;
    var s = S.sleuven[S.sel]; if (!s) return;
    var d = el.dataset;
    if (d.toonalles) { TOONALLES = !TOONALLES; }
    else if (d.zijde) { s.zijde = d.zijde; syncDoorsteek(s); }
    else if (d.zijdee !== undefined) { s.zijdeEinde = d.zijdee === s.zijde ? '' : d.zijdee; syncDoorsteek(s); }
    else if (d.delmp !== undefined) { s.tussen.splice(+d.delmp, 1); }
    else if (d.voegtoe) {
      var p = $('nwPartij').value, t = ($('nwType').value || '').trim(); if (!t) return;
      S.eigen[p] = S.eigen[p] || []; if (typesVan(p).indexOf(t) < 0) S.eigen[p].push(t);
      s.leidingen[p + '|' + t] = 1;
    } else return;
    bewaar(); renderFormulier(); tekenKaart(false); renderActies();
  });
  function zetMeters(k, v) {
    var sx = S.sleuven[k]; if (!sx) return; sx.meters = v; bewaar(); tekenKaart(false);
    var gi = document.querySelector('input[data-gm="' + k + '"]'); if (gi && gi.value !== v) gi.value = v;
    var qi = $('qMeters'); if (qi && k === S.sel && qi.value !== v) qi.value = v;
  }
  $('acties').addEventListener('input', function (e) {
    if (e.target.id === 'qMeters') zetMeters(S.sel >= 0 ? S.sel : S.sleuven.length - 1, e.target.value);
  });
  $('formulier').addEventListener('input', function (e) {
    var t = e.target, dd = t.dataset;
    if (dd.gm !== undefined) zetMeters(+dd.gm, t.value);
    else if (dd.gl !== undefined) { var sx = S.sleuven[+dd.gl], n = parseInt(t.value, 10); if (sx) { if (n > 0) sx.leidingen[dd.key] = n; else delete sx.leidingen[dd.key]; bewaar(); } }
    else if (dd.go !== undefined) { var so = S.sleuven[+dd.go]; if (so) { so.opm = t.value; bewaar(); } }
  });

  // ---------- Overzicht ----------
  function samenvat(s, i) {
    var lei = Object.keys(s.leidingen).map(function (k) { return k.replace('|', ': ') + (s.leidingen[k] > 1 ? ' x' + s.leidingen[k] : ''); });
    return 'Sleuf ' + (i + 1) + ': ' + (s.meters || '?') + ' m, ' + s.zijde + (s.zijdeEinde && s.zijdeEinde !== s.zijde ? ' -> ' + s.zijdeEinde : '') + ', ' + (s.bovenbouw || 'bovenbouw ?') +
      (lei.length ? ' | ' + lei.join(', ') : '') + (s.bijz.length ? ' | ' + s.bijz.join(', ') : '') + (doorsteken(s).length ? ' | ' + doorsteken(s).map(function (d) { return 'doorsteek ' + d.van.z + '->' + d.tot.z + ' ca. ' + d.m + ' m'; }).join(', ') : '') + ((s.tussen || []).length ? ' | meetpunten: ' + s.tussen.map(function (m) { return m.z; }).join(', ') : '') + (s.opm ? ' | ' + s.opm : '');
  }
  function rijen() {
    var r = [];
    r.push({ kop: 'Bovenbouw' });
    BOVENBOUW.forEach(function (b) { r.push({ naam: b, tel: function (s) { return s.bovenbouw === b; } }); });
    r.push({ kop: 'Werken en bijzonderheden' });
    BIJZ.forEach(function (b) { r.push({ naam: b, tel: function (s) { return s.bijz.indexOf(b) >= 0; } }); });
    PARTIJEN.forEach(function (p) {
      r.push({ kop: p.naam });
      typesVan(p.naam).forEach(function (t) { var k = p.naam + '|' + t; r.push({ naam: t, tel: function (s) { return !!s.leidingen[k]; }, aantal: function (s) { return s.leidingen[k]; } }); });
    });
    return r;
  }
  function renderOverzicht() {
    var lijst = $('lijst');
    if (!S.sleuven.length) { lijst.innerHTML = '<div class="klein">Nog geen sleuven.</div>'; $('tabel').innerHTML = ''; return; }
    lijst.innerHTML = S.sleuven.map(function (s, i) { return '<div class="kaart-sleuf">' + esc(samenvat(s, i)) + '</div>'; }).join('');
    var n = S.sleuven.length, kop = '<tr><th class="l">Opnameblad</th>';
    for (var i = 0; i < n; i++) kop += '<th>' + kol(i) + '</th>';
    kop += '<th>Totaal</th></tr>';
    var body = '';
    rijen().forEach(function (r) {
      if (r.kop) { body += '<tr class="kop"><td colspan="' + (n + 2) + '">' + esc(r.kop) + '</td></tr>'; return; }
      var som = 0, cellen = '', gebruikt = false;
      S.sleuven.forEach(function (s) {
        if (r.tel(s)) { var m = parseFloat(String(s.meters).replace(',', '.')); gebruikt = true; if (!isNaN(m)) som += m; var a = r.aantal ? r.aantal(s) : 1; cellen += '<td>' + (isNaN(m) ? '?' : m) + (a > 1 ? ' x' + a : '') + '</td>'; }
        else cellen += '<td></td>';
      });
      if (gebruikt) body += '<tr><td class="l">' + esc(r.naam) + '</td>' + cellen + '<td><b>' + Math.round(som * 10) / 10 + '</b></td></tr>';
    });
    $('tabel').innerHTML = '<table>' + kop + body + '</table>';
  }
  function tekstUitvoer() {
    return 'Werf: ' + (S.werf || '-') + '\n' + S.sleuven.map(samenvat).join('\n');
  }
  $('kopieer').onclick = function () {
    var t = tekstUitvoer();
    function ok() { $('melding').textContent = 'Gekopieerd.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { $('melding').textContent = 'Kopiëren lukte niet.'; });
    else $('melding').textContent = 'Kopiëren wordt niet ondersteund.';
  };
  $('csv').onclick = function () {
    var regels = [['Werf', 'Sleuf', 'Meters', 'Zijde begin', 'Zijde einde', 'Bovenbouw', 'Leidingen', 'Bijzonderheden', 'Opmerking', 'Lat start', 'Lng start', 'Lat einde', 'Lng einde', 'Meetpunten (zijde, lat, lng)']];
    S.sleuven.forEach(function (s, i) {
      var a = s.start || ['', ''], b = s.einde || ['', ''];
      var lei = Object.keys(s.leidingen).map(function (k) { return k.replace('|', ': ') + ' x' + s.leidingen[k]; }).join('; ');
      regels.push([S.werf, kol(i), s.meters, s.zijde, s.zijdeEinde || s.zijde, s.bovenbouw, lei, s.bijz.join('; '), s.opm, a[0], a[1], b[0], b[1], (s.tussen || []).map(function (m) { return m.z + ', ' + m.p[0] + ', ' + m.p[1]; }).join(' | ')]);
    });
    var csv = regels.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';'); }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'opmeting_' + (S.werf || 'werf').replace(/[^\w-]+/g, '_') + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  };
  $('wis').onclick = function () {
    if (!confirm('Alle sleuven van deze opmeting wissen? Dit kan niet ongedaan gemaakt worden.')) return;
    S.sleuven = []; S.sel = -1; S.mid = null; S.t0 = null; S.verzonden = null; bewaar(); renderAlles();
  };

  // ---------- Tabs en start ----------
  function toon(naam) {
    $('vOpmeten').classList.toggle('verborgen', naam !== 'opmeten');
    $('vOverzicht').classList.toggle('verborgen', naam !== 'overzicht');
    $('tabOpmeten').classList.toggle('aan', naam === 'opmeten');
    $('tabOverzicht').classList.toggle('aan', naam === 'overzicht');
    if (naam === 'overzicht') renderOverzicht(); else setTimeout(function () { kaart.invalidateSize(); }, 50);
  }
  $('tabOpmeten').onclick = function () { toon('opmeten'); };
  $('tabOverzicht').onclick = function () { toon('overzicht'); };
  if (!S.werf && CTX.werf) { S.werf = CTX.werf; bewaar(); }
  $('werf').value = S.werf || '';
  $('werf').addEventListener('input', function () { S.werf = this.value; bewaar(); });

  function renderAlles() { renderActies(); renderFormulier(); tekenKaart(false); }
  renderAlles();
  zetSlot(true);
  stuurRij();
})();
</script>
<div class="appver">Opmeten 1.03</div>
</body>
</html>
